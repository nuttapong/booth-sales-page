<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกยอดขายหน้าร้าน (Cloud Synced)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --text: #1e293b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; margin: 0; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .status-badge { font-size: 13px; color: #64748b; }
    .summary-card { background: var(--card-bg); padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border); display: flex; gap: 20px; margin-bottom: 16px; }
    .summary-item h4 { margin: 0 0 4px; color: #64748b; font-size: 13px; }
    .summary-item .amount { font-size: 18px; font-weight: bold; color: var(--success); }
    .table-container { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { background-color: #f1f5f9; font-size: 13px; }
    .product-cell { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; }
    .product-img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #eee; }
    .qty-badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; background: #e2e8f0; font-size: 12px; font-weight: bold; }
    .btn-group { display: flex; align-items: center; gap: 6px; }
    .btn { border: none; border-radius: 6px; padding: 6px 12px; font-weight: bold; cursor: pointer; }
    .btn-inc { background-color: var(--success); color: white; }
    .btn-dec { background-color: var(--danger); color: white; }
    .btn-sync { background-color: #475569; color: white; padding: 6px 12px; border-radius: 6px; }
    .sold-count { font-size: 15px; font-weight: 600; min-width: 24px; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h3 style="margin:0;">ระบบบันทึกยอดขายบูธ</h3>
      <span class="status-badge" id="sync-status">สถานะ: พร้อมใช้งาน</span>
    </div>
    <button class="btn btn-sync" onclick="fetchProducts()">รีเฟรชข้อมูล</button>
  </header>

  <div class="summary-card" id="summary-section"></div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>สินค้า</th>
          <th>คงเหลือ</th>
          <th>ราคา</th>
          <th style="text-align: center;">บันทึกขาย</th>
          <th>ขายแล้ว</th>
          <th>ยอดรวม</th>
        </tr>
      </thead>
      <tbody id="product-list">
        <tr><td colspan="6" style="text-align:center; padding: 20px;">กำลังโหลดข้อมูลจาก Google Sheets...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // *** วาง Web App URL จาก Step 2 ที่นี่ ***
  const API_URL = "https://script.google.com/macros/s/AKfycbxIzNu83fqUywa_gNealfcVQaBJS4JfbsiIXq1w5Rw-0lBPlcJjPRLEyJhjric71V3K/exec";

  let products = [];

  async function fetchProducts() {
    document.getElementById("sync-status").innerText = "สถานะ: กำลังดึงข้อมูลล่าสุด...";
    try {
      const res = await fetch(API_URL);
      products = await res.json();
      render();
      document.getElementById("sync-status").innerText = "สถานะ: อัปเดตล่าสุด " + new Date().toLocaleTimeString();
    } catch (err) {
      document.getElementById("sync-status").innerText = "สถานะ: เชื่อมต่อไม่สำเร็จ";
    }
  }

  async function changeSale(id, delta) {
    const item = products.find(p => p.id === id);
    if (!item) return;

    if (delta > 0 && item.stock <= 0) {
      alert("สินค้าหมดสต็อก!");
      return;
    }
    if (delta < 0 && item.sold <= 0) return;

    // Optimistic UI update (ปรับบนหน้าจอก่อนเพื่อให้คนขายไม่ต้องรอนาน)
    item.sold += delta;
    item.stock -= delta;
    render();

    document.getElementById("sync-status").innerText = "สถานะ: กำลังซิงก์ข้อมูลขึ้น Cloud...";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ id, delta })
      });
      const result = await res.json();
      if (!result.success) {
        alert("บันทึกล้มเหลว: " + result.message);
        // ถ้ายิงไม่สำเร็จ ให้ดึงค่าจริงจากชีตกลับมาคืน
        fetchProducts();
      } else {
        document.getElementById("sync-status").innerText = "สถานะ: บันทึกสำเร็จ " + new Date().toLocaleTimeString();
      }
    } catch (err) {
      alert("เกิดข้อผิดพลาดในการเชื่อมต่อเน็ต");
      fetchProducts();
    }
  }

  function render() {
    const listEl = document.getElementById("product-list");
    const summaryEl = document.getElementById("summary-section");
    listEl.innerHTML = "";

    const totalsByCurrency = {};

    products.forEach(p => {
      const lineTotal = p.sold * p.price;
      totalsByCurrency[p.currency] = (totalsByCurrency[p.currency] || 0) + lineTotal;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <div class="product-cell">
            <img src="${p.img}" class="product-img">
            <span>${p.name}</span>
          </div>
        </td>
        <td><span class="qty-badge">${p.stock}</span></td>
        <td>${p.price.toLocaleString()} ${p.currency}</td>
        <td>
          <div class="btn-group" style="justify-content: center;">
            <button class="btn btn-dec" onclick="changeSale(${p.id}, -1)">-</button>
            <span class="sold-count">${p.sold}</span>
            <button class="btn btn-inc" onclick="changeSale(${p.id}, 1)">+</button>
          </div>
        </td>
        <td>${p.sold}</td>
        <td style="font-weight: bold; color: var(--primary);">${lineTotal.toLocaleString()} ${p.currency}</td>
      `;
      listEl.appendChild(tr);
    });

    summaryEl.innerHTML = Object.entries(totalsByCurrency).map(([curr, total]) => `
      <div class="summary-item">
        <h4>ยอดรวม (${curr})</h4>
        <div class="amount">${total.toLocaleString()} ${curr}</div>
      </div>
    `).join("");
  }

  // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
  fetchProducts();

  // ตั้งเวลาดึงข้อมูลอัตโนมัติทุก 30 วินาที เพื่อให้ข้อมูลระหว่างเครื่องตรงกัน
  setInterval(fetchProducts, 30000);
</script>

</body>
</html>
